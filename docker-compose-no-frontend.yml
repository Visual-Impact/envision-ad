services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: envision_ad_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - appnet

  # Local SMTP catcher: every email the backend sends in dev lands here instead of a real inbox.
  # Web inbox at http://localhost:8025. See application-local.yml for why this is mandatory.
  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP — also where a host-native bootRun sends
      - "8025:8025"  # web inbox
    networks:
      - appnet

  webservice:
    build:
      context: ./webservice
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_BASE_URL: "${APP_BASE_URL}"
      SPRING_PROFILES_ACTIVE: "local"
      # CLOUDINARY
      CLOUDINARY_URL: "cloudinary://${NEXT_PUBLIC_CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}"
      #     AUTH0
      AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE}"
      AUTH0_MGMT_CLIENT_ID: "${AUTH0_MGMT_CLIENT_ID}"
      AUTH0_MGMT_CLIENT_SECRET: "${AUTH0_MGMT_CLIENT_SECRET}"
      AUTH0_MGMT_DOMAIN: "${AUTH0_MGMT_DOMAIN}"
      AUTH0_DB_CONNECTION: "${AUTH0_DB_CONNECTION}"
      # Spring datasource - Postgres runs natively on the host, reached via host.docker.internal
      SPRING_DATASOURCE_URL: "jdbc:postgresql://host.docker.internal:5432/${SPRING_DATASOURCE_DBNAME}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      # EMAIL — the local profile sends all mail to the mailpit service; Doppler's EMAIL_* are unused here
      LOCAL_MAIL_HOST: "mailpit"
      #     STRIPE
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_EVENTS_WEBHOOK_SECRET: "${STRIPE_EVENTS_WEBHOOK_SECRET}"
      STRIPE_CONNECT_WEBHOOK_SECRET: "${STRIPE_CONNECT_WEBHOOK_SECRET}"
      STRIPE_CONNECT_CLIENT_ID: "${STRIPE_CONNECT_CLIENT_ID}"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

