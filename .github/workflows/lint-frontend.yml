name: Lint Frontend

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'frontend/**'

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24, not 20: steiger's parser loads a WebAssembly module that fails on Node 20
          # ("bad export type for 'deleter'"). Verified on 22 and 24. The app itself still
          # builds and ships on Node 20 (frontend/Dockerfile) — this is the linter's runtime only.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run FSD architecture lint (steiger)
        run: npm run lint:fsd
