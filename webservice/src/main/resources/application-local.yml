spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Adds db/seed on top of the default db/migration, local only — application-prod.yml
    # does not set this key, so prod keeps resolving to the plain db/migration default.
    locations: classpath:db/migration,classpath:db/seed
