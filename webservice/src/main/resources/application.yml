spring:
  application:
    name: webservice
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none        # Don't let Hibernate manage schema, use schema.sql instead
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: "20260525.001"
  mail:
    host: ${EMAIL_SMTP}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Backend health check
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false  # Disable mail health check

okta:
  oauth2:
    issuer: "https://${AUTH0_DOMAIN}/"
    audience: ${AUTH0_AUDIENCE}

auth0:
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
    audience: https://${AUTH0_MGMT_DOMAIN}/api/v2/
    token-url: https://${AUTH0_MGMT_DOMAIN}/oauth/token
    base-url: https://${AUTH0_MGMT_DOMAIN}/
    # P5: the tenant's database connection name, required by POST /api/v2/users
    # (Auth0Service.createUser). New Doppler secret — see P5-PROGRESS.md M2 notes.
    connection: ${AUTH0_DB_CONNECTION}

app:
  base:
    url: ${APP_BASE_URL}
  mail:
    # Sender on every email the backend sends. Defaults to the SMTP login. EMAIL_FROM adds a
    # display name or uses an alias of that account, and must include the address in angle
    # brackets ("Envision Ad <no-reply@envision-ad.ca>"): a bare name makes every send fail.
    from: ${EMAIL_FROM:${EMAIL_USER}}

stripe:
  api-key: ${STRIPE_SECRET_KEY}
  webhook-secret-events: ${STRIPE_EVENTS_WEBHOOK_SECRET}
  webhook-secret-connect: ${STRIPE_CONNECT_WEBHOOK_SECRET}
  platform-fee-percent: 30
  connect:
    client-id: ${STRIPE_CONNECT_CLIENT_ID}

envision:
  active-campaign:
    # FR-7: how long after a swap or manual notify the next one is refused. Media owners act on
    # these emails by physically changing a screen, so a burst of them is noise rather than
    # information. A value, not a literal in code, so it can be tuned against real usage.
    swap-debounce: 10m
    # FR-8.5: how long creative changes sit untouched before media owners are told on the
    # advertiser's behalf. Long enough that assembling a campaign in one sitting is one email;
    # short enough that a screen never shows retired creative for a whole business day.
    notify-quiet-period: 60m
    sweep:
      # More often than the quiet period, so a batch waits no longer than it has to.
      interval: 15m
      enabled: true
  proof-of-display:
    reminders:
      # P12: monthly reminder emails (last day of the month for media owners, the 1st for
      # advertisers). The schedule itself is fixed in ProofOfDisplayScheduledJobs.
      enabled: true
  payouts:
    retry:
      # BundlePayoutRetryJob: retries media-owner payouts Stripe rejected for insufficient
      # available funds. Each payout is retried at most once a day (Stripe replays a reused
      # idempotency key's cached error for ~24h), so the interval only bounds how late after
      # that a retry happens.
      enabled: true
      interval: 1h
      # After this, a payout still short of funds is left FAILED for a human to settle. Card
      # payments become available within days, so a month covers that several times over.
      # For a share that was held for onboarding, the month counts from its release.
      max-age: 30d
    hold:
      # BundlePayoutHoldJob: pays shares held for media owners whose Stripe Connect onboarding
      # was incomplete when the invoice was paid, once it completes, and expires them after
      # max-age. The webhook releases most of them immediately; this is the backstop.
      enabled: true
      interval: 1h
      # Set by the Terms of Service, §7 (media owners, payouts): "within 90 days after the
      # invoice is paid". Do not change it without changing the Terms.
      max-age: 90d
