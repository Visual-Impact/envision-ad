spring:
  application:
    name: webservice
  datasource:
    hikari:
      maximum-pool-size: 10
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: none        # Don't let Hibernate manage schema, use schema.sql instead
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: "20260525.001"
  mail:
    host: ${EMAIL_SMTP}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USER}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Backend health check
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false  # Disable mail health check

okta:
  oauth2:
    issuer: "https://${AUTH0_DOMAIN}/"
    audience: ${AUTH0_AUDIENCE}

auth0:
  management:
    client-id: ${AUTH0_MGMT_CLIENT_ID}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
    audience: https://${AUTH0_MGMT_DOMAIN}/api/v2/
    token-url: https://${AUTH0_MGMT_DOMAIN}/oauth/token
    base-url: https://${AUTH0_MGMT_DOMAIN}/
    # P5: the tenant's database connection name, required by POST /api/v2/users
    # (Auth0Service.createUser). New Doppler secret — see P5-PROGRESS.md M2 notes.
    connection: ${AUTH0_DB_CONNECTION}

app:
  base:
    url: ${APP_BASE_URL}

stripe:
  api-key: ${STRIPE_SECRET_KEY}
  webhook-secret-events: ${STRIPE_EVENTS_WEBHOOK_SECRET}
  webhook-secret-connect: ${STRIPE_CONNECT_WEBHOOK_SECRET}
  platform-fee-percent: 30
  connect:
    client-id: ${STRIPE_CONNECT_CLIENT_ID}
