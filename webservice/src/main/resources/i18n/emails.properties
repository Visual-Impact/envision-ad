# Every email subject and body the backend sends — English. This is also the base bundle,
# so any key missing from emails_fr.properties falls back to the text here.
#
# Read through utils/EmailTexts. Every text goes through java.text.MessageFormat, so:
#   - a literal apostrophe is written '' (two single quotes);
#   - {n} is an argument the sending service fills in (names, links, pre-built lists).
# Keep emails_fr.properties in step: same keys, same arguments.

# A dollar amount. {0} is the number, already written the way this language writes it.
money=${0}

greeting.named=Hi {0},
greeting.anonymous=Hi there,

# --- Media owners: new creatives to put on their screens ---------------------------------
# Shared by the campaign-swap email and the new-subscription email. {0} advertiser name.
creatives.subject=New creatives for your Envision Ad screens — {0}

# ActiveCampaignServiceImpl, when the advertiser switches to another campaign.
# {0} advertiser name, {1} campaign name, {2} creative sections (each ends with a blank line),
# {3} comma-separated screen names.
creatives.swap.body=Hi there,\n\n\
{0} has updated the campaign displayed on your screens to "{1}".\n\
Please update your displays with the following creatives:\n\n\
{2}\
Screens affected: {3}\n\n\
Thanks,\n\
— The Envision Ad Team

# ActiveCampaignServiceImpl, when the advertiser changes the creatives of the campaign that is
# already running. Same arguments as creatives.swap.body.
creatives.update.body=Hi there,\n\n\
{0} has changed the creatives for "{1}", the campaign already running on your screens.\n\
Please replace the previous set with the following:\n\n\
{2}\
Screens affected: {3}\n\n\
Thanks,\n\
— The Envision Ad Team

# Header above the creatives meant for one venue type. {0} venue name.
creatives.section.venue=For your {0} screens:

# One creative in a swap or update email. {0} creative name, {1} its type, {2} its URL.
creatives.item={0} ({1}): {2}

# One creative in the new-subscription email. {0} creative name, {1} its URL.
creatives.subscription.item={0}: {1}

# BundleSubscriptionServiceImpl, when an advertiser subscribes to a bundle with the owner's screens.
# {0} advertiser name, {1} bundle name, {2} the owner's screens (one line each),
# {3} monthly earnings (see money), {4} campaign name, {5} creatives (one line each).
creatives.subscription.body=Hi there,\n\n\
{0} just subscribed to the "{1}" bundle, which includes the following of your screens:\n\n\
{2}\n\
You''ll earn {3}/month from this subscription.\n\n\
Campaign: {4}\n\n\
Please update your display(s) with the following creatives:\n\n\
{5}\n\
Thanks for partnering with Envision Ad!\n\
— The Envision Ad Team

# --- Invitations and account setup -------------------------------------------------------
# BusinessServiceImpl, invitation to join a business. {0} business name, {1} accept link.
invitation.subject=Invitation to join {0} on Envision Ad
invitation.body=Hi there,\n\n\
You''ve been invited to join {0} on Envision Ad, \
a platform connecting digital signage screens with advertisers.\n\n\
Click the link below to accept:\n\
{1}\n\n\
This invitation link expires in 1 hour.\n\n\
— The Envision Ad Team

# Subject shared by the three set-your-password emails below.
account.ready.subject=Your Envision Ad account is ready

# BusinessServiceImpl, after an invitee without an account accepts.
# {0} invitee name, {1} business name, {2} set-password link, {3} login link.
account.joined.body=Hi {0},\n\n\
You''ve joined {1} on Envision Ad.\n\n\
Set your password to get started:\n\
{2}\n\n\
Once set, log in here:\n\
{3}\n\n\
— The Envision Ad Team

# AdminAccountServiceImpl, an admin creates a business and its owner's account.
# {0} greeting line, {1} business name, {2} set-password link, {3} login link.
account.created.body={0}\n\n\
An Envision Ad account has been created for {1}.\n\n\
Set your password to get started:\n\
{2}\n\n\
Once set, log in here:\n\
{3}\n\n\
— The Envision Ad Team

# AdminAccountServiceImpl, an admin resends the owner's set-password link.
# {0} business name, {1} set-password link, {2} login link.
account.resend.body=Hi there,\n\n\
Here''s a fresh link to set your password for {0} on Envision Ad:\n\
{1}\n\n\
Once set, log in here:\n\
{2}\n\n\
— The Envision Ad Team

# --- Monthly proof-of-display reminders (ProofOfDisplayReminderService) ------------------
# Media owners, last day of the month. {0} one line per subscription, {1} link to the proof page.
reminder.owner.subject=Monthly check: your proof-of-display links
reminder.owner.body=Hi there,\n\n\
It''s the end of the month. Please check that the proof-of-display page for each of \
these subscriptions shows your screens as they are now. The advertisers will be \
reminded to look at it tomorrow.\n\n\
{0}\n\
Add or update your links here:\n\
{1}\n\n\
Thanks,\n\
— The Envision Ad Team
# Link status at the end of an owner's subscription line. {0} the link.
reminder.owner.linkMissing=no link yet, please add one
reminder.owner.linkSet=link set ({0})
# One subscription line in the owner reminder. {0} advertiser, {1} bundle, {2} linkSet or linkMissing.
reminder.owner.line={0}, {1}: {2}

# Advertisers, the 1st. {0} one line per subscription, {1} link to the Subscriptions page.
reminder.advertiser.subject=Your monthly proof of display is ready to check
reminder.advertiser.body=Hi there,\n\n\
Your media owners keep a proof-of-display page for each of your subscriptions, \
showing your ad on their screens. Here is this month''s:\n\n\
{0}\n\
You can also see them all on your Subscriptions page:\n\
{1}\n\n\
Thanks,\n\
— The Envision Ad Team
# Ends an advertiser's subscription line when the owner has not added a link.
reminder.advertiser.linkMissing=no link yet, your media owner has been reminded to add one
# One subscription line in the advertiser reminder. {0} bundle, {1} media owner, {2} the link or linkMissing.
reminder.advertiser.line={0} ({1}): {2}

# Stand-ins when the business or bundle no longer exists.
reminder.unknownAdvertiser=An advertiser
reminder.unknownOwner=your media owner
reminder.unknownBundle=a bundle
